[package]
name = "spikes"
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
pingora = { version = "=0.9.1", features = ["proxy"] }
pingora-core = { version = "=0.9.1" }
async-trait = "=0.1.92"
h2 = "=0.4.20"
http = "=1.5.0"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "time", "sync", "signal", "macros", "io-util"] }
bytes = "=1.12.1"
sha2 = "=0.10.9"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
