[package]
name = "nico-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Canonical LLM model, client protocol codecs and provider adapters"

[dependencies]
nico-core.workspace = true
# The provider contract hands over a `Destination` and nothing else: TLS policy, budgets and framing
# stay in the data plane, and `nico-http` never depends on this crate.
nico-http.workspace = true
# The canonical values serialize for golden fixtures and diagnostics; the wire codecs arrive in a
# later step and own their own parsing.
serde.workspace = true
# `RawJson` is the only place an untyped JSON value is allowed: the JSON a caller declares (tool
# parameters, tool arguments, a structured-output schema) and unmodelled fields.
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true
