[package]
name = "nico-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Canonical LLM model, client protocol codecs and provider adapters"

[dependencies]
nico-core.workspace = true
# The provider contract hands over a `Destination` and nothing else: TLS policy, budgets and framing
# stay in the data plane, and `nico-http` never depends on this crate.
nico-http.workspace = true
# The canonical values serialize for golden fixtures and diagnostics; a wire codec owns its own
# parsing and does not go through these derives.
serde.workspace = true
# `RawJson` is the only place an untyped JSON value is allowed: the JSON a caller declares (tool
# parameters, tool arguments, a structured-output schema) and unmodelled fields.
serde_json.workspace = true
thiserror.workspace = true
# A duplicate registration is reported, not asserted: this crate is assembled by the process, and a
# panic there would be worse than a kind that was registered once.
tracing.workspace = true
# The breaker's clock is `tokio::time::Instant` — pausable in tests, like the rate limiter's.
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
