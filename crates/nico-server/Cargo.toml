[package]
name = "nico-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "nico: the binary crate that assembles bootstrap, configuration pipeline and data planes"

[[bin]]
# The product users run: `nico --bootstrap <path>`. The package keeps the role name so the
# dependency graph still reads `nico-server -> nico-http -> nico-core`.
name = "nico"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
nico-config.workspace = true
nico-core.workspace = true
nico-http.workspace = true
# The binary is the one crate that assembles concrete implementations, so it names Pingora's server
# directly. The `proxy` feature is already on through `nico-http`, which owns that integration.
pingora.workspace = true
serde.workspace = true
serde_norway.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
bytes.workspace = true
futures-core.workspace = true
# The HTTP data-plane tests drive a real server over a hand-written client and a hand-written mock
# upstream on loopback sockets. No HTTP library is added on purpose: the wire bytes are the subject,
# so a crate that frames them for us would hide the behaviour under test.
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "test-util", "time"] }

[lints]
workspace = true
