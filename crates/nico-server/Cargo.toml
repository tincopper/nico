[package]
name = "nico-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "nico: the binary crate that assembles bootstrap, configuration pipeline and data planes"

[[bin]]
# The product users run: `nico --bootstrap <path>`. The package keeps the role name so the
# dependency graph still reads `nico-server -> nico-http -> nico-core`.
name = "nico"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
nico-config.workspace = true
nico-core.workspace = true
nico-http.workspace = true
# The binary is the one crate that assembles concrete implementations, and the LLM codecs and
# provider adapters are two of them: the process publishes one plan per generation, built from these
# registries.
nico-llm.workspace = true
# The binary is the one crate that assembles concrete implementations, and the plugin compiler is one
# of them: it is constructed here once per process and handed to the reload pipeline.
nico-plugins.workspace = true
# The binary is the one crate that assembles concrete implementations, so it names Pingora's server
# directly. The `proxy` feature is already on through `nico-http`, which owns that integration.
pingora.workspace = true
serde.workspace = true
serde_norway.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
# The plugin scenarios sign a real HS256 token over a real HMAC: a hand-rolled signer in the test
# would be a second implementation of the format under test.
base64.workspace = true
bytes.workspace = true
futures-core.workspace = true
hmac.workspace = true
# The HTTP data-plane tests drive a real server over a hand-written client and a hand-written mock
# upstream on loopback sockets. No HTTP library is added on purpose: the wire bytes are the subject,
# so a crate that frames them for us would hide the behaviour under test.
sha2.workspace = true
# The converted-request scenarios assert on the provider document the adapter produced: the mock
# received JSON, and parsing it is the only way to state "the physical model reached the origin"
# without matching on key order or whitespace.
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "test-util", "time"] }

[lints]
workspace = true
