[package]
name = "nico-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "nico: the binary crate that assembles bootstrap, configuration pipeline and data planes"

[[bin]]
# The product users run: `nico --bootstrap <path>`. The package keeps the role name so the
# dependency graph still reads `nico-server -> nico-http -> nico-core`.
name = "nico"
path = "src/main.rs"

[features]
# The build decides which role this binary serves. `llm` is on by default: the development form is
# the all-in-one gateway, and a deployment that serves only traffic passes
# `--no-default-features --features traffic`.
#
# The features are additive, not exclusive: `traffic` removes nothing from the code, it simply does
# not compile `nico-llm`, so its registries are empty and a document that declares a provider route
# is refused at publication — the last known good generation keeps serving. A role therefore cannot
# lie about itself: it is a property of the artifact, not a field a bootstrap file could set wrong.
default = ["llm"]
# The AI role: client protocol codecs and provider adapters are compiled in and published per
# generation.
llm = ["dep:nico-llm"]
# The etcd configuration source: `config_source.type: etcd` is accepted and wired at startup only
# when this feature is on. Off by default, because the client is the tonic/gRPC stack the roadmap
# flagged beside pingora's, and the product binary does not link it.
etcd = ["dep:nico-config-etcd", "dep:nico-quota-storage", "nico-quota-storage/etcd", "dep:etcd-client"]
# The traffic role: configuration, routing, plugins and the HTTP data plane, with no LLM crate at all.
traffic = []
# The WASM plugin host: `kind: wasm` is accepted and run in the wasmi sandbox only when this feature
# is on. Off by default, because the interpreter is a dependency the built-in-only deployments never
# need, and the gating is verified per release (`dependency_boundaries.rs`).
wasm = ["nico-plugins/wasm"]
# The Redis quota backend: its client is the third network stack, so it ships only when a
# deployment asks for it. The bootstrap refuses `quota_store.type: redis` in a build without it.
redis = ["dep:nico-quota-storage", "nico-quota-storage/redis"]

[dependencies]
async-trait.workspace = true
# The metrics listener's `ServeHttp` implementation returns `http::Response<Vec<u8>>`, and Pingora
# does not re-export the `http` crate. This is the one adapter that names the type.
http.workspace = true
nico-config.workspace = true
nico-config-etcd = { workspace = true, optional = true }
nico-core.workspace = true
nico-http.workspace = true
# The binary is the one crate that assembles concrete implementations, and the LLM codecs and
# provider adapters are two of them: the process publishes one plan per generation, built from these
# registries. Optional: the traffic role compiles without it, and everything LLM-shaped is gated on
# the feature.
nico-llm = { workspace = true, optional = true }
# The self-reporting capability layer: the recorder, the render and the readiness projection. The
# binary owns the transport (port preflight, Pingora service, assembly); this crate owns none of it.
nico-metrics.workspace = true
# The binary emits the configuration lifecycle metrics through the facade. The recorder itself is
# installed by `nico-metrics`, which is the only crate that names the exporter.
metrics.workspace = true
# The binary is the one crate that assembles concrete implementations, and the plugin compiler is one
# of them: it is constructed here once per process and handed to the reload pipeline.
nico-plugins.workspace = true
nico-quota-storage = { workspace = true, optional = true }
etcd-client = { workspace = true, optional = true }
# The binary is the one crate that assembles concrete implementations, so it names Pingora's server
# directly. The `proxy` feature is already on through `nico-http`, which owns that integration.
pingora.workspace = true
serde.workspace = true
serde_norway.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
# The E2E wasm fixtures are `.wat` text compiled at test time; the CI toolchain stays a Rust one.
wat.workspace = true
# The plugin scenarios sign a real HS256 token over a real HMAC: a hand-rolled signer in the test
# would be a second implementation of the format under test.
base64.workspace = true
bytes.workspace = true
futures-core.workspace = true
hmac.workspace = true
# The HTTP data-plane tests drive a real server over a hand-written client and a hand-written mock
# upstream on loopback sockets. No HTTP library is added on purpose: the wire bytes are the subject,
# so a crate that frames them for us would hide the behaviour under test.
sha2.workspace = true
# The converted-request scenarios assert on the provider document the adapter produced: the mock
# received JSON, and parsing it is the only way to state "the physical model reached the origin"
# without matching on key order or whitespace.
serde_json.workspace = true
# The TLS scenarios need an origin whose certificate the scenario chooses, which is a real TLS
# listener. Declared in the workspace table like every other dependency: its version must be the
# one `pingora-rustls` resolves to, or the graph would hold two rustls.
tokio-rustls.workspace = true
# The bootstrap-to-source wiring test drives the etcd protocol double over a real gRPC wire, so the
# whole chain is asserted without an etcd environment. `mock-server` exists only for that.
nico-config-etcd = { workspace = true, features = ["mock-server"] }
# The origin reads its certificate and key with the same PEM reader the production startup check uses
# for a trust bundle, so a fixture is read exactly like a deployment's file.
rustls-pemfile.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "test-util", "time"] }

[lints]
workspace = true
