[package]
name = "nico-config-etcd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "etcd configuration source: the adapter semantics over a client seam, with the wire behind it"

[features]
default = ["client"]
# The real gRPC client. The adapter semantics do not need it; enabling it links the tonic/hyper
# stack the roadmap flagged as a second network stack beside pingora's. The stack check lives in
# this crate's docs: it is documented, gated out of the product binary, and verified per release.
client = ["dep:etcd-client", "dep:tonic"]

[dependencies]
etcd-client = { version = "0.14", default-features = false, optional = true }
# The real client classifies gRPC statuses into the seam's two failure reasons; the crate already
# links tonic through etcd-client, so naming it directly adds no new stack.
tonic = { version = "0.12", default-features = false, optional = true, features = ["codegen", "transport", "prost"] }
async-trait.workspace = true
bytes.workspace = true
futures-core.workspace = true
nico-config.workspace = true
nico-core.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
tokio-util.workspace = true

[build-dependencies]
tonic-build = { version = "0.12", default-features = false, features = ["prost"] }

[dev-dependencies]
prost = "0.13"
tonic = { version = "0.12", default-features = false, features = ["transport", "codegen", "prost"] }
tokio = { workspace = true, features = ["test-util", "rt-multi-thread", "macros", "sync"] }
# The mock server hands its pre-bound listener to tonic as an incoming stream, which keeps the
# ephemeral port bound exactly once (no free-port race).
tokio-stream = { version = "0.1", features = ["net", "sync"] }

[lints]
workspace = true
