# cargo-deny configuration: advisories, licenses, bans, sources.
#
# The workspace is a binary workspace, so Cargo.lock is committed and duplicate versions are
# visible in review; `multiple-versions` is a warning until the dependency tree stabilises.

[advisories]
version = 2
yanked = "warn"
ignore = []

[licenses]
version = 2
# Transitive crates only need to match one of these; anything else fails the gate.
allow = [
    "Apache-2.0",
    "MIT",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
