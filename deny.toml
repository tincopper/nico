# cargo-deny configuration: advisories, licenses, bans, sources.
#
# The workspace is a binary workspace, so Cargo.lock is committed and duplicate versions are
# visible in review; `multiple-versions` is a warning until the dependency tree stabilises.

[advisories]
version = 2
yanked = "warn"
# The entries below arrive with pingora 0.9.1's *non-optional* dependencies, and every one is an
# `unmaintained` advisory rather than a vulnerability. Re-check them all on every pingora upgrade:
# if upstream either drops the crate or ships a fix, delete the ignore instead of widening it.
ignore = [
    # derivative 2.2.0 <- pingora-core. A derive helper used by pingora's own internals; no
    # replacement release exists and none of its generated code runs on our request path.
    "RUSTSEC-2024-0388",
    # unsafe-libyaml 0.2.11 <- pingora-core -> serde_yaml. Reachable only from ServerConf's
    # load_yaml/to_yaml helpers; we build ServerConf programmatically and never hand it YAML.
    "RUSTSEC-2024-0449",
    # pin-utils 0.1.1 <- pingora-core -> futures-util. The crate is unmaintained (its repository was
    # archived), not vulnerable, and the advisory offers no upgrade: futures-util depends on it and
    # futures-util is a non-optional dependency of pingora-core, so it cannot be compiled out. It is
    # a macro-only helper (`pin_mut!`, `unsafe_pinned!`); nothing of ours is written against it.
    # Re-check on every pingora upgrade: drop this entry as soon as futures-util stops depending on it.
    "RUSTSEC-2026-0441",
    # rustls-pemfile 2.2.0 <- pingora-rustls (and our own direct dependency on the same crate, so the
    # startup check and the handshake agree on what a certificate is) and <- rustls-native-certs.
    # Deprecated, not vulnerable: upstream archived the repository and moved the identical parsing
    # code into `rustls-pki-types` (`PemObject`), of which 2.2.0 is a thin wrapper — so the logic is
    # still maintained, just at its new home. It cannot be compiled out (pingora-rustls depends on
    # it non-optionally), and what it parses here is local, operator-owned input read once at
    # startup: the `tls.ca_file` bundle and the platform store. No request byte ever reaches it.
    # Re-check on every pingora upgrade: drop this entry when pingora-rustls moves to
    # `rustls-pki-types` directly.
    "RUSTSEC-2025-0134",
    # chrono 0.4.45 <- pingora-core (and pingora-cache <- pingora-proxy). Unmaintained as a whole
    # crate, not vulnerable: the advisory offers no fixed version ("no safe upgrade is available"),
    # and chrono is a non-optional dependency of pingora-core, so it cannot be compiled out.
    # Nothing of ours names a `chrono` type — it is pingora's own date arithmetic, and it never sees
    # a byte of ours. Re-check on every pingora upgrade: drop this entry when upstream moves to
    # `jiff` or `time`.
    "RUSTSEC-2026-0543",
]

[licenses]
version = 2
# Transitive crates only need to match one of these; anything else fails the gate.
allow = [
    "Apache-2.0",
    "MIT",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    # Added with pingora 0.9.1. Both are OSI-approved and permissive; every crate below them is a
    # non-optional dependency of pingora-core, so they cannot be compiled out:
    #   BSD-3-Clause -> brotli (alloc-no-stdlib, alloc-stdlib), zstd, pingora-cache -> blake2 -> subtle
    #   Zlib         -> foldhash <- hashbrown <- h2
    "BSD-3-Clause",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
