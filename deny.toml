# cargo-deny configuration: advisories, licenses, bans, sources.
#
# The workspace is a binary workspace, so Cargo.lock is committed and duplicate versions are
# visible in review; `multiple-versions` is a warning until the dependency tree stabilises.

[advisories]
version = 2
yanked = "warn"
# Both entries arrive with pingora 0.9.1's *non-optional* dependencies, and both are
# `unmaintained` advisories rather than vulnerabilities. Re-check both on every pingora upgrade:
# if upstream either drops the crate or ships a fix, delete the ignore instead of widening it.
ignore = [
    # derivative 2.2.0 <- pingora-core. A derive helper used by pingora's own internals; no
    # replacement release exists and none of its generated code runs on our request path.
    "RUSTSEC-2024-0388",
    # unsafe-libyaml 0.2.11 <- pingora-core -> serde_yaml. Reachable only from ServerConf's
    # load_yaml/to_yaml helpers; we build ServerConf programmatically and never hand it YAML.
    "RUSTSEC-2024-0449",
]

[licenses]
version = 2
# Transitive crates only need to match one of these; anything else fails the gate.
allow = [
    "Apache-2.0",
    "MIT",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    # Added with pingora 0.9.1. Both are OSI-approved and permissive; every crate below them is a
    # non-optional dependency of pingora-core, so they cannot be compiled out:
    #   BSD-3-Clause -> brotli (alloc-no-stdlib, alloc-stdlib), zstd, pingora-cache -> blake2 -> subtle
    #   Zlib         -> foldhash <- hashbrown <- h2
    "BSD-3-Clause",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
