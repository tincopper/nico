# Settings that cannot be expressed as a lint level.
#
# Tests are where `expect` belongs, so the panic-free policy must not make them unwritable under
# `cargo clippy --all-targets`. In tests prefer `expect("<what failed>")` over `unwrap()`.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

# Keep in sync with `[workspace.package] rust-version`.
msrv = "1.85"
