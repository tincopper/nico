[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# Pinned versions: see .trellis/tasks/11-03-phase0-tech-verification/design.md section 2.
arc-swap = "=1.9.3"
async-trait = "=0.1.92"
# JWT segments are base64url without padding (RFC 7515), and the API-key filter decodes nothing else.
base64 = "=0.22.1"
wat = "1"
wasmi = "0.51"
nico-wasm = { path = "crates/nico-wasm" }
bytes = "=1.12.1"
# The `ServeHttp` contract Pingora's `HttpServer::new_app` accepts returns `http::Response<Vec<u8>>`,
# and Pingora does not re-export the `http` crate. The metrics listener's adapter is the one place
# that names the type, so the crate is a direct dependency of `nico-server` only.
http = "=1.5.0"
futures-core = "=0.3.31"
# HS256 is HMAC-SHA256; `hmac` is the MAC construction and `sha2` the hash it is built on (already a
# dependency of nico-core's digest work). Both are needed only by `nico-plugins`.
hmac = "=0.12.1"
# The token-bucket table is bounded by `max_keys` and evicts least-recently-used buckets; an
# unbounded map would let a caller grow the table one key per request.
lru = "=0.18.5"
# The metrics facade: a recording call is one atomic read when no recorder is installed, which is
# why the request path and the config pipeline emit through it unconditionally.
metrics = "=0.24.6"
# Member selection: the Picker contract and its strategies. A workspace member crate rather than an
# external dependency; listed here so every consumer names it the same way.
nico-lb = { version = "0.0.0", path = "crates/nico-lb" }
# The Prometheus recorder, used only by `nico-metrics`. `default-features = false` is mandatory:
# the default features pull in hyper/tokio/rustls and would create a second network stack beside
# Pingora's. `install_recorder()` starts no task, so upkeep runs at scrape time.
metrics-exporter-prometheus = { version = "=0.18.3", default-features = false }
notify = "=8.2.1"
# The HTTP data plane's runtime. Pinned exactly: nico-http's hook contract is derived from
# 0.9.1 source (see .trellis/tasks/11-04-s1-2-http-data-plane/design.md); re-verify on upgrade.
pingora = "=0.9.1"
proptest = "1"
# The upstream TLS client this build speaks, through pingora's `rustls` backend. `pingora-rustls`
# 0.9.1 requires `^0.23.12`, and cargo unifies the graph on one version, so the graph holds exactly
# one rustls and one `ring`: a second version would mean two crypto stacks, two root stores and two
# handshake error types. Pinned to the newest 0.23 patch, which is also what clears the advisories
# the older ones carry. `nico-http` names it directly to run *pingora's own* trust-store parse at
# startup (see `upstream/tls/policy.rs`), not to build a client of its own.
#
# `default-features = false` is mandatory, not tidiness: rustls' default turns on `aws-lc-rs`, which
# would compile a *second* crypto provider beside pingora's `ring` (with its own C build) and leave
# `CryptoProvider` ambiguous — no crate feature then names a provider, and every `ClientConfig::builder`
# that runs before pingora's own install panics. The feature list below is exactly the set
# `pingora-rustls` asks for, so the two consumers cannot drift.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "logging", "std", "tls12"] }
# The PEM reader `pingora-rustls` uses for `ConnectorOptions::ca_file`. Depending on the same crate
# is what makes the startup check and the handshake agree on which bytes are a certificate.
rustls-pemfile = "=2.2.0"
# The platform trust store, read by the very call `pingora-rustls` makes while building its client
# connector (`load_native_certs`, honouring `SSL_CERT_FILE` / `SSL_CERT_DIR`). The startup probe in
# `upstream/tls/mod.rs` reads it first so an unreadable store fails startup instead of a panic
# inside `HttpProxy::new`.
rustls-native-certs = "=0.7.3"
# The TLS listener the integration scenarios need: they present the certificate a scenario chooses,
# so the handshake is real rather than mocked. `default-features = false` is mandatory for the same
# reason as `rustls` above — tokio-rustls' defaults add `aws-lc-rs`, which would put a second crypto
# provider in the graph. Dev-only: no shipped binary links it.
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["logging", "ring", "tls12"] }
serde = { version = "=1.0.229", features = ["derive"] }
# A plugin reads its configuration as JSON text (the contract's shape) while the document hands it
# over as YAML: one serializer at publication turns one into the other, never the request path.
serde_json = "=1.0.154"
serde_norway = "=0.9.42"
sha2 = "=0.10.9"
# Signature and API-key comparison must not leak a matching prefix through timing.
subtle = "=2.6.1"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", default-features = false }
tokio-util = "=0.7.20"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"

nico-core = { version = "0.0.0", path = "crates/nico-core" }
nico-config = { version = "0.0.0", path = "crates/nico-config" }
nico-config-etcd = { version = "0.0.0", path = "crates/nico-config-etcd" }
nico-http = { version = "0.0.0", path = "crates/nico-http" }
nico-llm = { version = "0.0.0", path = "crates/nico-llm" }
# The self-reporting capability layer: recorder installation, Prometheus rendering and the
# readiness projection. It deliberately depends on neither Pingora nor `nico-http`, so the
# exporter never enters the data plane's dependency tree.
nico-metrics = { version = "0.0.0", path = "crates/nico-metrics" }
nico-plugins = { version = "0.0.0", path = "crates/nico-plugins" }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
unreachable_pub = "warn"
nonstandard_style = { level = "deny", priority = -1 }
future_incompatible = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = 10 }
# Performance and correctness lints worth calling out explicitly.
redundant_clone = { level = "deny", priority = 9 }
large_enum_variant = { level = "deny", priority = 9 }
clone_on_copy = { level = "deny", priority = 9 }
needless_borrow = { level = "deny", priority = 9 }
needless_collect = { level = "deny", priority = 9 }
manual_ok_or = { level = "deny", priority = 9 }
map_unwrap_or = { level = "deny", priority = 9 }
await_holding_lock = { level = "deny", priority = 9 }
# Panic-free policy (restriction lints are not in `all`, so they must be named).
unwrap_used = { level = "deny", priority = 8 }
expect_used = { level = "deny", priority = 8 }
panic = { level = "deny", priority = 8 }
unreachable = { level = "deny", priority = 8 }
todo = { level = "deny", priority = 8 }
unimplemented = { level = "deny", priority = 8 }
dbg_macro = { level = "deny", priority = 8 }
print_stdout = { level = "deny", priority = 8 }
print_stderr = { level = "deny", priority = 8 }
# Documentation lints, because public APIs are documented here.
missing_errors_doc = { level = "warn", priority = 7 }
missing_panics_doc = { level = "warn", priority = 7 }
missing_safety_doc = { level = "warn", priority = 7 }
empty_docs = { level = "deny", priority = 7 }
# Strict groups: allowed at bootstrap, flipped to "warn" once the tree is clean.
pedantic = { level = "allow", priority = 3 }
nursery = { level = "allow", priority = 3 }
