# Local-only bootstrap: where the gateway reads its configuration from, and how far to trust it.
#
# This file is read before any configuration source exists, so it must never be served by a config
# source. It selects exactly one authoritative source; the last-known-good cache is not a peer.
config_source:
  type: local
  path: ./config/resources.yaml
  max_bytes: 1048576
  # notify | signal | notify+signal
  watch: notify+signal

# Debounce change events, but never postpone a publish past max_wait_ms while changes keep coming.
debounce_ms: 200
max_wait_ms: 1000

# Last-known-good cache written after a successful publish (temp file + fsync + atomic rename).
cache_dir: ./.tmp/cache
# Only start from the cache when explicitly allowed; the snapshot is then marked stale.
allow_bootstrap_cache: false

# Parse-time shape bounds for the resources document. The whole section may be omitted, and so may
# any single field: an omitted bound takes its value from SchemaBounds::default(). A bound that is
# written must be in 1..=1000000 (max_routes, max_upstreams, max_providers, max_plugins),
# 1..=10000000 (max_nodes) or 1..=128 (max_depth). A value of 0 or any value above those limits fails
# at startup instead of falling back to the default, so a typo never looks like an applied bound.
schema_bounds:
  max_routes: 1024
  max_upstreams: 256
  max_providers: 64
  max_plugins: 256
  max_nodes: 100000
  max_depth: 32

# Process-level HTTP settings. They are deliberately not part of the resources document: the
# listener and the drain windows belong to this process, so a pushed configuration must not be able
# to move them. The whole section and every field in it may be omitted; an omitted field takes its
# built-in default, while a field that is written is validated at startup instead of being absorbed
# by that default. The values written here are the built-in defaults, so this file documents them
# without changing behaviour.
http:
  # The `ip:port` (or `host:port`) the data plane binds. The port may not be zero.
  listen: 0.0.0.0:8080
  # Accept cleartext HTTP/2 (h2c) on that listener. Never implied: a proxy in front must know that
  # it may speak HTTP/2 without TLS.
  h2c: false
  # How long in-flight requests may keep running once shutdown begins, and the upper bound on the
  # final drain. The drain bound may not be shorter than the grace period, or a streaming response
  # would be cut off before it could finish.
  grace_period_ms: 5000
  graceful_shutdown_ms: 30000
  # Worker threads per service. At least one: the count is handed to Tokio's runtime builder, which
  # rejects zero, so a written zero fails at startup instead of panicking on the first request.
  threads: 1

# Upstream TLS trust roots. The whole section may be omitted, in which case the platform certificate
# store is used and `SSL_CERT_FILE` / `SSL_CERT_DIR` are honoured by the TLS provider itself. A
# written `ca_file` is a **complete** trust-root set: it *replaces* the platform store rather than
# adding to it, so a deployment that needs both concatenates the public roots and its private CA into
# one file. The roots are read once, when the service is built, so changing this file takes a restart
# and never a reload. If neither source can be read, or reads as no certificate at all, the process
# refuses to start instead of serving with an empty trust store.
# tls:
#   ca_file: /etc/nico/roots.pem
