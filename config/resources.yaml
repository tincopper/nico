# Gateway resources document served by the local configuration source.
#
# The envelope and the per-request bounds are fixed. `providers`, `upstreams`, `routes` and `plugins`
# are required sections: each may be empty, but omitting one is a schema error rather than an
# implicit empty list, so a truncated document never looks like a working configuration.
apiVersion: gateway/v1
request:
  # Any u32: 0 means "accept no request body". The default document stays within 1 MiB.
  max_body_bytes: 1048576
  # Optional ceiling on a buffered (non-streaming) response body. The default is 8 MiB; a route may
  # only tighten it (a route value above this one is a publication failure), and an event stream is
  # never buffered, so it is not bounded by this. A declared length over the bound is answered
  # `502 upstream_response_too_large` before the head is written; a chunked answer is metered in the
  # body stage, where the status line is already committed.
  # max_response_bytes: 8388608
  # 1..=600000 milliseconds.
  timeout_ms: 30000

# LLM providers. Credentials are referenced, never written here: `env:VAR` or `file:/path`.
# The reference below is `env:OPENAI_API_KEY`, so a local run needs that variable set; a document
# whose credential cannot be read is refused as a whole (see CONTRIBUTING.md).
#
# `kind` names one adapter — one wire document shape — and the publication resolves it against the
# registry. Four kinds are served: `openai` (Chat Completions), `openai_responses` (the same vendor's
# Responses dialect; one dialect is one kind, so `native_protocol` stays a single value), `anthropic`
# (Messages) and `gemini` (`generateContent`). An unknown kind is refused when the document is
# compiled, never skipped.
providers:
  - name: openai-primary
    kind: openai
    base_url: https://api.openai.com
    credential_ref: env:OPENAI_API_KEY
    # Optional logical → physical model names. A caller writes `fast`; this endpoint is asked for
    # the name on the right. Without a map the caller's name is sent unchanged. Anything else that
    # differs between two endpoints — base URL, credential, timeout — needs a second provider entry,
    # because that is configuration of the endpoint rather than of one request.
    model_map:
      fast: gpt-4o-mini
    # Optional output ceiling this endpoint uses when the request sets none: a positive count, and a
    # request's own limit always wins. It is endpoint policy, not a gateway default — a protocol that
    # requires an output limit (`/v1/messages` does) cannot be served from a request that omits one
    # unless the route answers for it, while a dialect that allows omission needs no value here.
    # Zero is a schema error: it is not a ceiling. Nothing in this document needs it.
    # max_output_tokens: 8192
    # Optional failure budget. Consecutive failures that open the endpoint's breaker (default 5), and
    # how long an open breaker waits before it admits one probe (default 30000 ms). `failure_threshold:
    # 0` disables the breaker for this endpoint — failures are still counted and logged, but no request
    # is ever skipped because of them. Re-tuning either value starts the breaker's state over: the
    # parameters are part of the endpoint's identity, so a state cannot outlive the rules it ran under.
    # circuit_breaker:
    #   failure_threshold: 5
    #   cooldown_ms: 30000

# Plain HTTP upstreams. The scheme is `http` or `https`; the port is required.
upstreams:
  - name: api-backend
    scheme: http
    host: 127.0.0.1
    port: 8080

# Named plugins. This block defines instances; it does not decide where they run. A route runs the
# ones it references by name, and `global_plugins` (below) names the ones that run for every request
# before routing. An entry is an envelope — `name`/`kind`/`enabled`/`buffers_body`/`error_response` —
# plus a `config` the kind itself interprets. The document model does not know any kind's fields, so adding one is a change to the
# crate that implements it, not to this schema; an unknown kind is refused when the document is
# compiled, never skipped.
#
# Credentials are referenced, never written here: `env:VAR` or `file:/path`.
# A reference is read when the document is compiled, and `file:` is read byte for byte: a trailing
# newline left by `echo secret > file` is part of the key, so write the value exactly. An empty or
# unreadable credential rejects the whole document and the previously published one keeps serving.
#
# Three entry kinds are shown below. `public-jwt` authenticates a bearer token, so a local run needs
# `JWT_SECRET` in its environment: a document whose credential cannot be read is refused as a whole
# and the previously published one keeps serving, which is why this file cannot be run without it.
# The buffered entry below adds `UPLOAD_KEY` for the same reason.
#
# An entry is an INSTANCE, not a kind alias: two routes that need different parameters need two
# entries of the same kind, each referenced by name. Sharing one entry across routes shares its
# config and credentials; a rate limit's buckets are still per route, keyed by
# (route_id, instance name, subject|ip). YAML anchors and aliases are rejected by the parser, so
# duplicated parameters are generated (Helm/Kustomize), not factored with `&`/`*`.
#
# Not supported by design: per-route parameter overrides and per-use disabling. `enabled: false`
# stops an instance everywhere; see the task design notes for the upgrade triggers.
plugins:
  - name: public-jwt
    kind: jwt
    config:
      keys:
        - kid: k1
          secret_ref: env:JWT_SECRET
      issuer: https://id.example
      audience: api
  # `enabled: false` keeps the entry declared — a route may still reference it — but stops it from
  # being compiled or run, which is how a policy is taken out of service without editing every route.
  - name: api-quota
    kind: rate_limit
    enabled: true
    config:
      burst: 20
      per_second: 5
      max_keys: 10000
  # `buffers_body: true` is the one request-side mode a document can ask for: the data plane holds
  # every chunk back, calls `on_request_body` once with the whole body, and forwards what the plugin
  # returned. A body of unknown length can only be rewritten that way, and only a request can be
  # buffered at all — a response may be an endless stream.
  #
  # Two costs, both real: the upstream receives nothing until the client's last byte arrives, so its
  # latency includes the upload; and memory is `request.max_body_bytes` x the number of buffered
  # uploads in flight, because each one holds its body whole. That is why the mode is opt-in per
  # instance and why the route below is the only one that uses it.
  - name: upload-guard
    kind: api_key
    buffers_body: true
    config:
      header: x-upload-key
      keys:
        - name: uploader
          secret_ref: env:UPLOAD_KEY

# Use sites for the global scope: names declared above, in the order they should run within a phase.
# Empty by default, because declaring a plugin is not a decision to run it for every request. The
# shape is a list of instance names — `global_plugins: [public-jwt]` would authenticate every request
# before routing — and an entry listed here runs on requests that match no route at all, which is the
# reason an edge policy belongs here. A subject-keyed rate limit belongs on a route instead: before
# routing there is no route id and no identity, so a global limit can only be keyed by a hash of the
# client address.
global_plugins: []

# Every route names exactly one target: an `upstream` or a `provider`. `timeout_ms` and
# `max_body_bytes` are optional per-route overrides, bounded by the `request` section above, and
# `plugins` lists the policies the route runs (authenticate before limit, whatever the order here).
routes:
  - id: api-public-v1
    path_prefix: /api/
    upstream: api-backend
    plugins: [public-jwt, api-quota]
  # A provider route converts between the client protocol and the provider's: `protocol` names the
  # client protocol and is required here, because it is what selects the codec. Four are served:
  # `openai.chat`, `openai.responses`, `anthropic.messages` and `gemini.generate_content` — the same
  # values the `llm.protocol` log field carries, and the ones a caller's request must speak.
  # `mode: convert` (the default) decodes the caller's body and re-encodes it; `mode: passthrough`
  # forwards the bytes unchanged and is only meaningful when both sides speak the same protocol. Both
  # fields, and the response bound below, are refused on an upstream route: an upstream has no
  # exchange to convert.
  #
  # Passthrough has one hard limit: the `gemini.generate_content` ↔ `gemini` pair is refused at
  # publication, because that dialect carries the model and the operation in the request target — a
  # fixed target would forward the caller's bytes to whichever model and operation the route pinned.
  # Publication refuses the document as a whole (a route fact, not a parse failure) and the previous
  # generation keeps serving.
  #
  # The Gemini dialect also pins its model into the path: its provider's `model_map` must resolve to
  # one physical model, and a request that resolves to another name is answered `403`
  # `model_not_allowed`. Two aliases for one model are fine; two models are not.
  #
  # A converted route may also declare how it behaves when its target fails. `retry_budget` is the
  # total attempts one target absorbs, including the first (default 1 = no retry, ceiling 4); a
  # retryable failure within the budget is re-encoded for the same target from the canonical request,
  # never from the client's bytes. `fallback` names providers tried in order once the current target's
  # budget is spent — explicit, never inferred, at most three members, and every member must be
  # servable or the whole document is refused. Budget times targets is the whole sequence, and the
  # data plane's attempt loop is sized by exactly those two bounds. Both fields are refused on a
  # `passthrough` route: it has no canonical value and no failure classification, so there is nothing
  # to retry.
  #
  # One hard limit comes from the data plane, not from this document: a request body above 64 KiB
  # (Pingora's replay buffer) cannot be retried once it was dispatched, so such a failure is answered
  # instead of retried. Connect-stage failures are not subject to it.
  - id: llm-chat
    path_prefix: /v1/chat/
    provider: openai-primary
    protocol: openai.chat
    timeout_ms: 120000
    # A route may only tighten `request.max_response_bytes`; this route halves the 8 MiB default,
    # which is the value the memory arithmetic uses for a buffered (non-streaming) answer here.
    max_response_bytes: 4194304
    # retry_budget: 2
    # fallback: [openai-secondary]
  # A buffered route: `buffers_body` on any plugin in the chain puts this route, and only this route,
  # into whole-body mode. The bound stays the document's or tighter — a route can tighten a budget,
  # never widen it — so it is written here only to state the value the memory arithmetic uses.
  - id: upload
    path_prefix: /upload/
    upstream: api-backend
    max_body_bytes: 1048576
    plugins: [upload-guard]
